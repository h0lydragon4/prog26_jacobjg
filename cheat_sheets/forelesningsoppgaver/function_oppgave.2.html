<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions, oppgave 2</title>
</head>
<body>

    <script>
        const people = ["Marius", "Tore", "Susanne", "Monica", "Arne", "Zoltan", "Beate"]

        function sortArray(array) {
            //Jeg ønsker å sortere arrayen, dermed bruker jeg sort.
            array.sort()
            //Lage et ul-element
            const ul = document.createElement("ul")
            //Fylle inn ul-listen med listeelementer navn
            array.map(person => {
                //Lage en <li> (listeelement)
                const li = document.createElement("li")
                //Få navnet i"person"-parameteren
                li.innerHTML = person
                //Legge <li>-elementet inn i <ul>
                ul.appendChild(li)
            })
            //Legge <ul>-listen på nettsiden
            document.body.appendChild(ul)

            console.log(ul)
        }
        sortArray(people)
    </script>
</body>
</html>
